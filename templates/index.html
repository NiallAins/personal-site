    {{ head }}
     
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!--
    ---- Main page
    --->

    <section
        id="page_main"
        class="page--main"
    >

        <!--
        ---- Sky canvas
        --->

        <canvas
            id="canvas_sky"
            class="canvas__sky"
        ></canvas>

        
        <!--
        ---- Header
        --->
        
        <div class="header page-width-container">
            <header class="header__title">
                <h1 class="header__title--primary">
                    <span>Niall</span>
                    <span>Ainsworth</span>
                </h1>
                <span class="header__title--secondary">
                    <span>Design /</span>
                    <span>Development</span>
                </span>
            </header>

            <nav class="header__nav">
                <div class="header__nav-links">
                    <button
                        id="header_navLinksExperience"
                        class="header__nav-links-button"
                    >
                        Experience
                    </button>
                    <button
                        id="header_navLinksContact"
                        class="header__nav-links-button"
                    >
                        Contact
                    </button>
                </div>
                <button
                    id="header_navMore"
                    class="header__nav-more"
                >
                    <span> Dive into Projects </span>
                </button>
            </nav>
        </div>


        <!--
        ---- Sea and land canvas
        --->

        <canvas
            id="canvas_sea"
            class="canvas__sea"
        ></canvas>

        <button
            id="boat"
            class="canvas__boat"
            aria-label="Drive the boat. Arrow keys to move, space key to jump."
        ></button>


        <!--
        ---- Project label container
        --->

        <main
            id="topics"
            class="topics page-width-container"
        ></main>
    </section>


    <!--
    ---- Experience
    --->

    <section
        id="page_experience"
        class="page--topic page--long experience"
    >
        {{ cv }}

        <div class="experience__print">
            <button
                class="experience__print-button"
                onclick="print()"
            >
                Print / PDF
            </button>
        </div>
    </section>
    <button class="page__close"></button>


    <!--
    ---- Contact
    --->

    <section
        id="page_contact"
        class="page--topic"
    >
        <div class="block-layout page-width-container">
            <div class="block-layout__slot">
                <a
                    class="block-layout__item"
                    href="mailto:{{ email }}"
                >
                    <div></div>
                    <div
                        class="block-layout__item-image"
                        style="--bg-url: url('assets/email-logo.svg')"
                    ></div>
                    <div class="block-layout__item-label block-layout__item-label--sm">
                        {{ emailDisplay }}
                    </div>
                </a>
            </div>
            <div class="block-layout__slot">
                <a
                    class="block-layout__item"
                    href="https://www.linkedin.com/in/niall-ainsworth-5508551a3/"
                >
                    <div></div>
                    <div
                        class="block-layout__item-image"
                        style="--bg-url: url('assets/linkedin-logo.svg')"
                    ></div>
                    <div class="block-layout__item-label">
                        LinkedIn
                    </div>
                </a>
            </div>
            <div class="block-layout__slot">
                <a
                    class="block-layout__item"
                    href="https://github.com/NiallAins"
                >
                    <div></div>
                    <div
                        class="block-layout__item-image"
                        style="--bg-url: url('assets/github-logo.svg')"
                    ></div>
                    <div class="block-layout__item-label">
                        GitHub
                    </div>
                </a>
            </div>
            <div class="block-layout__slot">
                <a
                    class="block-layout__item"
                    href="https://codepen.io/niallains"
                >
                    <div></div>
                    <div
                        class="block-layout__item-image"
                        style="--bg-url: url('assets/codepen-logo.svg')"
                    ></div>
                    <div class="block-layout__item-label">
                        CodePen
                    </div>
                </a>
            </div>
        </div>
    </section>
    <button class="page__close"></button>


    <!--
    ---- Topic page
    --->

    <section
        id="page_topic"
        class="page--topic"
    ></section>
    <button class="page__close"></button>


    <!--
    ---- Individual project page
    --->

    <section
        id="page_project"
        class="page--project"
    >
        <div class="project page-width-container">
            <div class="project__body">
                <h2
                    id="project_title"
                    class="project__title"
                ></h2>
                <div
                    id="project_tags"
                    class="project__tags"
                ></div>
                <a
                    id="project_image"
                    class="project__image"
                    aria-label="Open project. Link is displaying a screenshot from the project."
                ></a>
                <p
                    id="project_desc"
                    class="project__desc"
                ></p>
                <div class="project__links">
                    <a
                        id="project_linkLive"
                        class="project__links-link"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="-2 -2 4 4"
                            aria-hidden="true"
                            class="project__links-link-svg"
                        >
                            <path
                                class="project__links-link-svg-color"
                                d="M0 -2 2 -1 2 1 0 2 -2 1 -2 -1"
                            ></path>
                            <path d="M-2 -1 0 0 0 2 -2 1Z" fill="#0008"></path>
                            <path d="M0 0 2 -1 2 1 0 2Z" fill="#0005"></path>
                        </svg>
                        <span class="project__links-link-text">
                            Open project
                        </span>
                    </a>
                    <a
                        id="project_linkCode"
                        class="project__links-link"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="-2 -2 4 4"
                            aria-hidden="true"
                            class="project__links-link-svg"
                        >
                            <path
                                class="project__links-link-svg-color"
                                d="M0 -2 2 -1 2 1 0 2 -2 1 -2 -1"
                            ></path>
                            <path d="M-2 -1 0 0 0 2 -2 1Z" fill="#0008"></path>
                            <path d="M0 0 2 -1 2 1 0 2Z" fill="#0005"></path>
                        </svg>
                        <span class="project__links-link-text">
                            View code
                        </span>
                    </a>
                </div>
            </div>
            <button
                id="project_close"
                class="project__close"
            >
                <span> More projects </span>
            </button>
        </div>
    </section>

    <script src="script.js"></script>

</body>

</html>
